name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Generate config.js from GitHub Secrets (file is gitignored)
      - name: Generate config.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          STREAK_API_KEY: ${{ secrets.STREAK_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - << 'PYEOF'
          import os, json
          vals = {
              'supabaseUrl':    os.environ['SUPABASE_URL'],
              'supabaseKey':    os.environ['SUPABASE_KEY'],
              'streakApiKey':   os.environ['STREAK_API_KEY'],
              'googleClientId': os.environ.get('GOOGLE_CLIENT_ID', ''),
              'gmailScopes':    'https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.labels',
              'openaiApiKey':   os.environ['OPENAI_API_KEY'],
          }
          lines = ['var CONFIG = {']
          for k, v in vals.items():
              lines.append(f'    {k}: {json.dumps(v)},')
          lines.append('};')
          with open('config.js', 'w') as f:
              f.write('\n'.join(lines) + '\n')
          print('config.js generated OK')
          PYEOF
          echo "=== config.js structure (secrets masked by GitHub) ==="
          cat config.js

      # Debug: confirm FTP credentials and directory structure
      - name: Probe FTP directory structure
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "=== FTP_HOST value ==="
          echo "$FTP_HOST"
          echo "=== Verbose FTP connect + list root ==="
          curl -v --list-only -u "${FTP_USER}:${FTP_PASS}" "ftp://${FTP_HOST}/" 2>&1 || true

      # Upload every file explicitly with curl — no black-box, no skipping
      - name: Upload files to Hostinger
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          upload() {
            local file=$1
            echo "→ uploading $file ..."
            curl --fail --show-error --silent \
                 --ftp-create-dirs \
                 -u "${FTP_USER}:${FTP_PASS}" \
                 -T "$file" \
                 "ftp://${FTP_HOST}/public_html/${file}"
            echo "✅ $file"
          }
          upload index.html
          upload app.js
          upload styles.css
          upload config.js
          upload data.js
          upload charts.js
          upload scoring.js
          upload .htaccess
          echo "=== All files uploaded ==="
