name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # config.js is gitignored — regenerate it from GitHub Secrets
      # Secrets are passed as env vars (avoids shell escaping issues with /, +, = in keys)
      # Python json.dumps handles all special characters safely
      - name: Generate config.js from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          STREAK_API_KEY: ${{ secrets.STREAK_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - << 'PYEOF'
          import os, json
          vals = {
              'supabaseUrl':   os.environ['SUPABASE_URL'],
              'supabaseKey':   os.environ['SUPABASE_KEY'],
              'streakApiKey':  os.environ['STREAK_API_KEY'],
              'googleClientId': os.environ.get('GOOGLE_CLIENT_ID', ''),
              'gmailScopes':   'https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.labels',
              'openaiApiKey':  os.environ['OPENAI_API_KEY'],
          }
          lines = ['var CONFIG = {']
          for k, v in vals.items():
              lines.append(f'    {k}: {json.dumps(v)},')
          lines.append('};')
          with open('config.js', 'w') as f:
              f.write('\n'.join(lines) + '\n')
          print('✅ config.js generated successfully')
          PYEOF
          # Verify structure (GitHub auto-masks actual secret values in logs)
          echo "--- config.js structure ---"
          cat config.js

      # Replace ?v=3 (or any ?v=xxx) in index.html with the git commit short SHA
      # This guarantees every deploy forces browsers to re-fetch JS/CSS
      - name: Bust asset cache with git commit SHA
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "Injecting cache-buster: $SHORT_SHA"
          sed -i "s/?v=[^\"']*\"/?v=${SHORT_SHA}\"/g" index.html
          # Verify the replacement worked
          grep -E '\?v=' index.html

      - name: Deploy to Hostinger via FTP
        run: |
          sudo apt-get install -y lftp
          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 30;
            set net:max-retries 3;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}';
            mirror --reverse --verbose \
              --exclude-glob .git \
              --exclude-glob .github \
              --exclude-glob .netlify \
              --exclude-glob CLAUDE_HANDOFF.md \
              --exclude-glob schema.sql \
              --exclude-glob README.md \
              --exclude-glob config.template.js \
              . /public_html/;
          "
